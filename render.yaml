# render.yaml — Render.com blueprint for AirWatch
# Deploys: API (web), Celery worker, Celery beat scheduler
# DATABASE_URL / REDIS_URL / OPENAQ_API_KEY must be set in the Render dashboard.

services:
  - type: web
    name: airwatch-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: PORT
        value: "8000"
    startCommand: >
      sh -c "python app/scripts/migrate.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"

  - type: worker
    name: airwatch-worker
    env: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: /app
    startCommand: celery -A app.worker.celery_app worker -l INFO

  - type: worker
    name: airwatch-beat
    env: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: /app
    startCommand: celery -A app.worker.celery_app beat -l INFO
